name: Deploy site to GitHub Pages
# Every push to main runs the checks first; the site only deploys if they pass.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Capture live-site thumbnails
        continue-on-error: true
        timeout-minutes: 6
        run: |
          mkdir -p /tmp/shots && cd /tmp/shots && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/.github/scripts/shots.mjs" . && cd "$GITHUB_WORKSPACE" && node /tmp/shots/shots.mjs
      - name: Collect only the public site files
        run: |
          mkdir _site
          cp -r index.html CNAME .nojekyll assets _site/
          ls -R _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check live site, www, HTTPS and link-preview assets
        run: |
          sleep 30
          fail=0
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://jonbushenterprises.com/); echo "apex: $code"; [ "$code" = 200 ] || fail=1
          echo "www:  $(curl -sS -o /dev/null -w '%{http_code} -> %{redirect_url}' https://www.jonbushenterprises.com/)"
          echo "http: $(curl -sS -o /dev/null -w '%{http_code} -> %{redirect_url}' http://jonbushenterprises.com/)"
          echo "cert: $(echo | openssl s_client -connect jonbushenterprises.com:443 -servername jonbushenterprises.com 2>/dev/null | openssl x509 -noout -enddate)"
          for a in assets/og-image.png assets/apple-touch-icon.png assets/favicon-32.png assets/shots/permitvista.jpg assets/shots/espiralusa.jpg assets/shots/moviz.jpg; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://jonbushenterprises.com/$a); echo "$a: $code"; [ "$code" = 200 ] || fail=1
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://jonbushenterprises.com/package.json); echo "package.json not public: $code"; [ "$code" = 404 ] || fail=1
          exit $fail
